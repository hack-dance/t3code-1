name: SSH alias Windows proof
on:
  push:
    branches: [verification/ssh-alias-windows]
permissions:
  contents: read
jobs:
  focused-proof:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install
      - name: Focused regression tests
        run: vp test run packages/source-control-core/src/server/sshRemote.test.ts packages/source-control-github/src/server/GitHubCredentials.test.ts packages/source-control-github/src/server/GitHubApi.test.ts packages/source-control-github/src/server/GitHubSourceControlProvider.test.ts packages/source-control-github/src/server/GitHubPullRequestApi.test.ts apps/server/src/sourceControl/SourceControlProviderRegistry.test.ts apps/server/src/pullRequest/PullRequestService.test.ts apps/server/src/assets/AssetAccess.test.ts packages/contracts/src/pullRequest.test.ts apps/web/src/components/pullRequest/pullRequestList.logic.test.ts apps/mobile/src/features/pull-requests/pullRequestList.test.ts
      - name: Native OpenSSH and Git with spaces and Unicode
        run: node scripts/verify-ssh-alias-native.ts
