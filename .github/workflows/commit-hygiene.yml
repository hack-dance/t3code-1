name: Commit hygiene

on:
  pull_request:
    branches: [hd/nightly]
  push:
    branches: [hd/nightly]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
    steps:
      # This public repository needs no checkout credentials. Avoid checkout's
      # recursive auth cleanup, which fails on vendored gitlinks without URLs.
      - name: Fetch full history without credentials
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: '0'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin https://github.com/hack-dance/t3code-1.git
          git -c credential.helper= fetch --no-tags --no-recurse-submodules origin "$BASE_SHA" "$HEAD_SHA"
          git checkout --detach "$HEAD_SHA"
      - name: Validate range and commit emails
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/check-commit-emails.sh "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA"
      - name: Download and verify gitleaks
        id: gitleaks
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Test commit hygiene regressions
        if: ${{ !cancelled() && steps.gitleaks.outcome == 'success' }}
        run: |
          bash .github/scripts/check-commit-emails.test.sh
          bash .github/scripts/commit-hygiene.test.sh "$RUNNER_TEMP/gitleaks/gitleaks"
      - name: Scan every new commit for secrets
        if: ${{ !cancelled() && steps.gitleaks.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/scan-commit-secrets.sh "$BASE_SHA" "$HEAD_SHA" "$RUNNER_TEMP/gitleaks/gitleaks"
